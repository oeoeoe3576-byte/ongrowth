<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><title>뷰티레터 No.12 릴스</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
/* 릴스 전용 짧은 버전: 글자는 가운데, 짧게 / 사진은 크게 */
.rs { width: 1080px; height: 1920px; position: relative; overflow: hidden; color: #fff; background: var(--plum); text-align: center; }
.rs em { font-style: normal; }
.rs .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rs .dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,26,32,0) 40%, rgba(42,26,32,.55) 75%, rgba(42,26,32,.7) 100%); }
.rs .bl-mark { position: absolute; top: 230px; left: 0; right: 0; font-family: var(--serif); font-size: 34px; letter-spacing: 7px; font-weight: 600; z-index: 3; }
.rs .bl-mark i { font-weight: 500; letter-spacing: 1px; }
.rs.light { background: var(--cream); color: var(--plum); }
.rs h1 { font-size: 104px; line-height: 1.18; font-weight: 800; letter-spacing: -3px; text-shadow: 0 4px 30px rgba(0,0,0,.25); }
.rs h1 em { color: var(--petal); }
.rs h2 { font-size: 92px; line-height: 1.18; font-weight: 800; letter-spacing: -3px; }
.rs h2 em { color: var(--rose); }
.rs small { display: block; font-size: 38px; font-weight: 800; color: var(--rose); margin-bottom: 14px; }

/* 사진 위 제목: 높이 2/3 */
.rs .ttl { position: absolute; left: 60px; right: 60px; top: 1280px; transform: translateY(-50%); z-index: 3; }
/* 가운데 묶음 */
.rs .box { position: absolute; left: 70px; right: 70px; top: 50%; transform: translateY(-55%); }
.rs .q { font-size: 54px; font-weight: 700; letter-spacing: -1.5px; margin-top: 30px; background: #fff; border-radius: 999px; padding: 30px 40px; }
.rs .q i { font-style: normal; color: var(--rose); margin-right: 14px; }

/* 눈썹 확대 사진: 크게, 화면 폭 꽉 */
.rs .hd { position: absolute; left: 60px; right: 60px; top: 330px; }
.rs .strip { position: absolute; left: 0; right: 0; background-size: 1404px 2496px; background-position: -162px -620px; }
.rs .strip .lb { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 46px; padding: 4px 34px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--plum); }
.rs .strip .lb.on { background: var(--rose); color: #fff; }
.rs .ring { position: absolute; width: 200px; height: 130px; border: 7px solid var(--rose); border-radius: 50%; z-index: 2; }
.rs .ring b { position: absolute; left: 50%; top: -70px; transform: translateX(-50%); white-space: nowrap; font-size: 36px; font-weight: 800; color: #fff; background: var(--rose); border-radius: 999px; padding: 6px 24px; }
.rs .under { position: absolute; left: 60px; right: 60px; font-size: 56px; font-weight: 800; letter-spacing: -1.5px; }
.rs .under em { color: var(--rose); }

/* 따라 하기 */
.rs .st { font-size: 56px; font-weight: 700; letter-spacing: -1.5px; margin-top: 30px; }
.rs .st i { font-style: normal; display: inline-flex; width: 72px; height: 72px; border-radius: 50%; background: var(--rose); color: #fff; font-family: var(--serif); font-size: 40px; align-items: center; justify-content: center; margin-right: 18px; vertical-align: middle; }

/* 마무리 */
.rs.end .ttl { top: 50%; }
.rs.end .fl { display: inline-block; margin-top: 50px; font-size: 42px; font-weight: 700; border: 3px solid rgba(255,255,255,.7); border-radius: 999px; padding: 22px 56px; }
.rs.end .ph { filter: blur(6px) brightness(.55); transform: scale(1.06); }
</style></head>
<body>
<section class="card rs" data-name="01_hook">
  <img class="ph static kb" src="img/reel_before.jpg" alt="" />
  <div class="dim static"></div>
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="ttl"><h1>왜 내 눈썹만<br/><em>세 보일까?</em></h1></div>
</section>

<section class="card rs light" data-name="02_situation">
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="box">
    <h2>이런 적<br/><em>있죠?</em></h2>
    <div class="q whole"><i>✓</i>"오늘 화났어?"</div>
    <div class="q whole"><i>✓</i>눈썹만 둥둥 떠 보일 때</div>
  </div>
</section>

<section class="card rs light" data-name="03_cause">
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="hd"><small>범인은</small><h2>뚝 끊긴 <em>꼬리</em></h2></div>
  <div class="strip whole" style="top:620px; height:640px; background-image:url(img/reel_before.jpg)"></div>
  <div class="ring whole" style="left:836px; top:754px"><b>여기서 뚝</b></div>
  <div class="under whole" style="top:1340px">짧고 각지면 <em>인상이 세져요</em></div>
</section>

<section class="card rs light" data-name="04_change">
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="hd"><small>꼬리만 바꿨어요</small><h2>가늘게, <em>길게</em></h2></div>
  <div class="strip static" style="top:540px; height:500px; background-position:-162px -640px; background-image:url(img/reel_before.jpg)"><span class="lb">Before</span></div>
  <div class="strip whole" style="top:1050px; height:500px; background-position:-162px -640px; background-image:url(img/reel_after.jpg)"><span class="lb on">After</span></div>
  <div class="ring whole" style="left:856px; top:1170px"><b>가늘게 쭉</b></div>
</section>

<section class="card rs light" data-name="05_how">
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="strip static" style="top:330px; height:560px; background-position:-162px -630px; background-image:url(img/reel_after.jpg)"></div>
  <div class="box" style="top:1250px; transform:translateY(-50%)">
    <div class="st whole"><i>1</i>얇은 펜슬로 짧게</div>
    <div class="st whole"><i>2</i>끝은 바늘처럼</div>
    <div class="st whole"><i>3</i>브러시로 풀기</div>
  </div>
</section>

<section class="card rs end" data-name="06_end">
  <img class="ph static" src="img/reel_after.jpg" alt="" />
  <div class="ttl"><h1>저장해 두고<br/><em>따라 해 보세요</em></h1><div class="fl whole">@from.beautyletter</div></div>
</section>
</body></html>
