<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>국내여행 카드뉴스 발행 대시보드</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">🧳 국내어디감</div>
      <button class="nav-item active" data-tab="create">카드뉴스 만들기</button>
      <button class="nav-item" data-tab="scheduled">예약 게시물</button>
      <button class="nav-item" data-tab="success">발행 완료</button>
      <button class="nav-item" data-tab="failed">발행 실패</button>
      <button class="nav-item" data-tab="templates">템플릿</button>
      <button class="nav-item" data-tab="settings">설정</button>
    </nav>

    <main class="content">
      <section id="tab-create" class="tab active">
        <h1>카드뉴스 만들기</h1>
        <form id="create-form" class="form-card">
          <label>주제 <span class="req">*</span>
            <input name="topic" required placeholder="예: 평창 가을 여행지 5곳" />
          </label>
          <label>지역 <small>(비우면 주제에서 추정)</small>
            <input name="region" placeholder="예: 강원 평창" />
          </label>
          <div class="row">
            <label>계절
              <input name="season" placeholder="예: 가을" />
            </label>
            <label>페이지 수
              <input name="slideCount" type="number" min="3" max="12" placeholder="7" />
            </label>
          </div>
          <div class="row">
            <label>템플릿
              <select name="template" id="template-select"><option value="">기본값</option></select>
            </label>
            <label>계정
              <input name="account" placeholder="기본 계정" />
            </label>
          </div>
          <label>CTA 문구 <small>(비우면 기본값)</small>
            <input name="cta" placeholder="저장해두고 여행할 때 꺼내보세요." />
          </label>
          <div class="row">
            <label>업로드 날짜
              <input name="publishDate" type="date" />
            </label>
            <label>업로드 시간
              <input name="publishTime" type="time" value="19:00" />
            </label>
          </div>
          <label class="checkbox">
            <input name="autoPublish" type="checkbox" /> 자동 발행 (체크 안 하면 REVIEW 승인 필요)
          </label>
          <button type="submit">카드뉴스 생성</button>
        </form>
        <div id="create-result" class="result-card hidden"></div>
      </section>

      <section id="tab-scheduled" class="tab">
        <h1>예약 게시물</h1>
        <table class="queue-table">
          <thead><tr><th>제목</th><th>날짜/시간</th><th>상태</th><th>재시도</th><th>액션</th></tr></thead>
          <tbody id="scheduled-body"></tbody>
        </table>
      </section>

      <section id="tab-success" class="tab">
        <h1>발행 완료</h1>
        <table class="queue-table">
          <thead><tr><th>제목</th><th>발행 시각</th><th>계정</th></tr></thead>
          <tbody id="success-body"></tbody>
        </table>
      </section>

      <section id="tab-failed" class="tab">
        <h1>발행 실패</h1>
        <table class="queue-table">
          <thead><tr><th>제목</th><th>재시도</th><th>오류</th><th>액션</th></tr></thead>
          <tbody id="failed-body"></tbody>
        </table>
      </section>

      <section id="tab-templates" class="tab">
        <h1>템플릿</h1>
        <div id="template-list" class="template-grid"></div>
      </section>

      <section id="tab-settings" class="tab">
        <h1>설정</h1>
        <pre id="settings-json" class="settings-box"></pre>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
