<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><title>뷰티레터 로퍼 릴스</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../reel.css" />
<style>
/* 신발 쪽 확대 */
.rs .feet { position: absolute; inset: 0; background-size: 1728px 3072px; background-position: -324px -1152px; background-repeat: no-repeat; }
.rs .dimt { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(42,26,32,0) 45%, rgba(42,26,32,.55) 75%, rgba(42,26,32,.7) 100%); }
.rs .high { position: absolute; left: 60px; right: 60px; top: 560px; transform: translateY(-50%); z-index: 3; }
.rs .high small { color: var(--petal); }
.rs .high h2 { color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.3); }
.rs .high h2 em { color: var(--petal); }
</style></head>
<body>
<section class="card rs" data-name="01_hook" data-thumb>
  <img class="ph static kb" src="img/reel_after.jpg" alt="" />
  <div class="dim static"></div>
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="ttl"><h1>올가을 신발은<br/><em>결국 로퍼</em></h1></div>
</section>

<section class="card rs" data-name="02_situation">
  <img class="ph static kb" src="img/reel_before.jpg" alt="" style="filter:blur(4px)" />
  <div class="dimc static"></div>
  <div class="box">
    <h1>이럴 때<br/><em>있죠?</em></h1>
    <div class="q2 whole" style="margin-top:60px">가을 코디가 늘 똑같을 때</div>
    <div class="q2 whole">운동화만 신으면 너무 편해 보일 때</div>
    <div class="q2 whole" style="margin-top:56px; font-size:46px; color:var(--petal)">신발 하나만 바꿔 보세요</div>
  </div>
</section>

<section class="card rs" data-name="03_before">
  <div class="feet static" style="background-image:url(img/reel_before.jpg)"></div>
  <div class="dimt static"></div>
  <div class="high"><small>셔츠 + 데님 + 운동화</small><h2>편하지만<br/><em>늘 보던 룩</em></h2></div>
</section>

<section class="card rs" data-name="04_after">
  <div class="feet static" style="background-image:url(img/reel_after.jpg)"></div>
  <div class="dimt static"></div>
  <div class="ring whole" style="left:365px; top:1435px; width:360px; height:200px"><b>신발만 로퍼로</b></div>
  <div class="high"><small>같은 옷, 신발만 바꿨어요</small><h2>훨씬<br/><em>정돈돼 보여요</em></h2></div>
</section>

<section class="card rs" data-name="05_how">
  <img class="ph static kb" src="img/reel_after.jpg" alt="" />
  <div class="dimb static"></div>
  <div class="low" style="top:1250px">
    <div class="st whole"><i>1</i>밑단은 발목 보이게</div>
    <div class="st whole"><i>2</i>가방·벨트와 색 맞추기</div>
    <div class="st whole"><i>3</i>웜톤은 브라운, 쿨톤은 블랙</div>
  </div>
</section>

<section class="card rs end" data-name="06_end">
  <img class="ph static" src="img/reel_after.jpg" alt="" />
  <div class="ttl"><h1>저장해 두고<br/><em>이번 주말에 신어 보세요</em></h1><div class="fl whole">@from.beautyletter</div></div>
</section>
</body></html>
