<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><title>잔머리 로우번 릴스</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../reel.css" />
<link rel="stylesheet" href="../../reel_paper.css" />
<style>.phsvg, .ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.pp .pmain { position:absolute; left:50%; top:210px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; }
.pp .pmain .pim { width:220px; height:200px; background:center/contain no-repeat; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }

.rs .ph2 { position:absolute; inset:0; width:100%; height:100%; }.pp .pmain .pnm { display:flex; flex-direction:column; align-items:center; background:none; color:#fff; padding:0 8px; font-size:68px; font-weight:900; line-height:1.15; letter-spacing:-0.04em; text-shadow:0 0 3px rgba(0,0,0,.85), 0 2px 4px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.45); }
.pp .pmain .pnm small { display:inline-block; background:var(--rose); color:#fff; text-shadow:none; padding:4px 16px; border-radius:30px; font-size:32px; margin-bottom:10px; }
.pp .pmain .pnm .hl { position:static; display:inline; inset:auto; color:inherit; font:inherit; background:linear-gradient(transparent 62%, rgba(225,80,130,.85) 62%, rgba(225,80,130,.85) 92%, transparent 92%); padding:0 6px; }
.pp .pmain .pim { width:240px; height:210px; }
.pp .pmain .pnm { white-space:nowrap; } .pp .pmain .pnm small { letter-spacing:0; word-spacing:4px; }
/* 온글잎 의연체: 영상 사용 가능, 파일 재배포 금지 → 저장소에 넣지 않는다. 없으면 fonts/local/에 내려받기: curl -o fonts/local/Uiyeun.woff https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105@1.1/Uiyeun.woff */
@font-face { font-family:"Uiyeun"; src:url(../../fonts/local/Uiyeun.woff) format("woff"); }
/* 설명글: 메인(제품명, 고딕 굵게)과 다른 글꼴로 '에디터 메모'처럼. 입술 옆 + 입술을 가리키는 화살표 */
.pp .side { position:absolute; color:#fff; text-shadow:0 0 3px rgba(0,0,0,.8), 0 2px 5px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.4); white-space:nowrap; }
.pp .side b { font-weight:inherit; color:#ffd3e1; }
.pp .side { font-family:"Uiyeun"; font-size:92px; line-height:1.08; letter-spacing:0; transform:rotate(-3deg); }
.pp .arw path { fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.pp .pnm-only { top:200px; }
.pp .ov .part, .rs .ov .part { fill:none; stroke:#ff8fb3; stroke-width:7; stroke-linecap:round; stroke-dasharray:2 14; filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); }

.pp .side.cx { left:200px !important; right:200px; white-space:normal; text-align:center; transform:rotate(-2deg); }
.pp .steps.txt .st { grid-template-columns: 1fr; }
.pp .steps.txt .st p { font-size: 46px; }
.pp .bl-end { position:absolute; left:0; right:0; top:830px; text-align:center; font-family:var(--serif); font-size:92px; letter-spacing:16px; font-weight:600; color:var(--ink); }
.pp .bl-end i { font-weight:500; letter-spacing:3px; color:var(--rose); }
.pp .stk { position:absolute; font-family:"Noto Color Emoji"; font-size:110px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)); transform:rotate(-8deg); }
.pp .tag { position:absolute; white-space:nowrap; background:#fff; color:#CF3F64; font-weight:900; font-size:42px; line-height:1.3; text-align:center; padding:8px 24px; border-radius:34px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
</style>
</head>
<body>
<!-- 이번에 반영한 점: 셀럽 따라하기 소재(조회 10만+ 근거), 대표 사진=한국인이 잘 아는 사람, 제목에 이름 없이 궁금증(잔머리), 글자 좌우 220px 안쪽, 캡션·영상에 사진 출처 문구 없음(sources.md에만) -->
<section class="card rs" data-name="01_thumb" data-thumb>

  <div class="static" style="position:absolute; left:0; right:0; bottom:0; height:760px; background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.72) 45%, rgba(0,0,0,.82));"></div>
  <div class="side" style="left:220px; top:1230px; font-size:70px;">반묶음 뒤로 굵은 컬<br/><b>얼굴형이 갸름해 보여요</b></div>

<section class="card pp" data-name="05_end" data-hold="1.4">

  <div class="follow cx static" style="top:1123px; font-size:40px; line-height:1.4; text-align:center; padding:24px 44px;">@from.beautyletter 팔로우하고<br/>뷰티 정보 받아가세요</div>
