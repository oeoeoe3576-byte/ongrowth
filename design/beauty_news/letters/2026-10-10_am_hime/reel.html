<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><title>뷰티레터 히메 커트 릴스</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../reel.css" />
<style>
.rs .ring.v { width: 170px; height: 280px; }
</style></head>
<body>
<section class="card rs" data-name="01_hook" data-thumb>
  <img class="ph static kb" src="img/reel_after.jpg" alt="" />
  <div class="dim static"></div>
  <div class="bl-mark static">BEAUTY <i>letter</i></div>
  <div class="ttl"><h1>요즘 파리에서<br/><em>따라 하는 한국 머리</em></h1></div>
</section>

<section class="card rs" data-name="02_situation">
  <img class="ph static kb" src="img/reel_before.jpg" alt="" style="filter:blur(4px)" />
  <div class="dimc static"></div>
  <div class="box">
    <h1>이럴 때<br/><em>있죠?</em></h1>
    <div class="q2 whole" style="margin-top:60px">긴 머리, 매일 똑같아 지겨울 때</div>
    <div class="q2 whole">그렇다고 자르긴 아까울 때</div>
    <div class="q2 whole" style="margin-top:56px; font-size:46px; color:var(--petal)">옆머리만 바꿔 보세요</div>
  </div>
</section>

<section class="card rs" data-name="03_before">
  <img class="ph static" src="img/reel_before.jpg" alt="" />
  <div class="dimb static"></div>
  <div class="low"><small>옆머리 없이 내리면</small><h2>얼굴 옆이<br/><em>그대로 드러나요</em></h2></div>
</section>

<section class="card rs" data-name="04_after">
  <img class="ph static" src="img/reel_after.jpg" alt="" />
  <div class="dimb static"></div>
  <div class="ring v whole" style="left:300px; top:690px"><b>여기만 싹둑</b></div>
  <div class="low"><small>옆머리만 볼~턱 길이로</small><h2>얼굴이<br/><em>작고 또렷하게</em></h2></div>
</section>

<section class="card rs" data-name="05_how">
  <img class="ph static kb" src="img/reel_after.jpg" alt="" />
  <div class="dimb static"></div>
  <div class="low" style="top:1310px">
    <div class="st whole"><i>1</i>판 고데기로 옆머리만</div>
    <div class="st whole"><i>2</i>끝에 오일 살짝</div>
    <div class="st whole"><i>3</i>자르는 건 꼭 미용실에서</div>
  </div>
</section>

<section class="card rs end" data-name="06_end">
  <img class="ph static" src="img/reel_after.jpg" alt="" />
  <div class="ttl"><h1>미용실 가기 전에<br/><em>저장해 두세요</em></h1><div class="fl whole">@from.beautyletter</div></div>
</section>
</body></html>
